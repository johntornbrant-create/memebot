name: memebot tick
# paper trading only - no keys, no real orders

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min, 24/7, PC off
  workflow_dispatch:            # manual "run now" button

permissions:
  contents: write

concurrency:
  group: memebot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one tick
        run: python -m bot.run

      - name: Commit state
        run: |
          git config user.name  "memebot"
          git config user.email "memebot@users.noreply.github.com"
          git add state reports
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "tick $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
