name: memebot weekly refit
# trains only on the bot own closed trades + shadow outcomes

on:
  schedule:
    - cron: "0 4 * * 1"        # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Refit even below the minimum trade count"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refit weights on our own closed trades
        env:
          FORCE_REFIT: ${{ inputs.force && '1' || '0' }}
        run: python -m bot.learn | tee refit.txt
      - name: Commit weights
        run: |
          set -e
          git config user.name  "memebot"
          git config user.email "memebot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin master
            git reset -q --soft origin/master
            git add -A state/weights.json
            if git diff --staged --quiet; then echo "weights unchanged"; exit 0; fi
            git commit -q -F refit.txt
            if git push -q origin HEAD:master; then echo "weights pushed"; exit 0; fi
            sleep 5
          done
          echo "::error::could not persist weights"
          exit 1
